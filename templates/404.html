{% extends 'base.html' %}
{% block title %}404 — Page Not Found | NexCart{% endblock %}

{% block content %}
<section class="section flex-center" style="min-height: 70vh;">
  <div class="container" style="max-width: 600px; text-align: center;">
    <div style="font-family: 'Outfit', sans-serif; font-size: 8rem; font-weight: 900; color: var(--primary); line-height: 1; letter-spacing: -0.05em; margin-bottom: 1rem;">
      404
    </div>
    <h1 style="font-size: 2.25rem; font-weight: 900; margin-bottom: 0.75rem;">Page Not Found</h1>
    <p style="color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 2rem; line-height: 1.6;">
      The requested page or item URL could not be located on NexCart. It may have been moved or removed.
    </p>

    <div class="flex-center gap-3">
      <a href="{% url 'core:home' %}" class="btn btn-primary btn-lg">&larr; Return to Home</a>
      <a href="{% url 'products:catalog' %}" class="btn btn-outline btn-lg">Explore Catalog</a>
    </div>
  </div>
</section>
{% endblock %}
