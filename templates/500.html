{% extends 'base.html' %}
{% block title %}500 — Server Error | NexCart{% endblock %}

{% block content %}
<section class="section flex-center" style="min-height: 70vh;">
  <div class="container" style="max-width: 600px; text-align: center;">
    <div style="font-family: 'Outfit', sans-serif; font-size: 8rem; font-weight: 900; color: var(--accent); line-height: 1; letter-spacing: -0.05em; margin-bottom: 1rem;">
      500
    </div>
    <h1 style="font-size: 2.25rem; font-weight: 900; margin-bottom: 0.75rem;">System Error</h1>
    <p style="color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 2rem; line-height: 1.6;">
      An unexpected internal server exception occurred on NexCart. Our engineering team has been notified.
    </p>

    <div class="flex-center gap-3">
      <a href="{% url 'core:home' %}" class="btn btn-primary btn-lg">&larr; Return to Home</a>
      <a href="{% url 'core:contact' %}" class="btn btn-outline btn-lg">Contact Concierge</a>
    </div>
  </div>
</section>
{% endblock %}
