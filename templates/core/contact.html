{% extends 'base.html' %}
{% block title %}VIP Concierge Support — NexCart{% endblock %}

{% block content %}
<section class="section">
  <div class="container" style="max-width: 800px;">
    <div style="text-align: center; margin-bottom: 3rem;">
      <span style="font-size: 0.8rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em;">24/7 Dedicated Support</span>
      <h1 style="font-size: 2.25rem; font-weight: 900; margin-top: 0.5rem;">NexCart Concierge</h1>
      <p style="font-size: 1.05rem; color: var(--text-secondary); margin-top: 0.5rem;">Questions regarding order tracking, product specifications, or VIP drops? Our team responds within 15 minutes.</p>
    </div>

    <div class="product-card" style="padding: 2.5rem;">
      <form onsubmit="event.preventDefault(); showToast('Thank you! Your inquiry was sent to NexCart VIP Concierge.', 'success');">
        <div class="grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 1.5rem;">
          <div>
            <label style="display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.5rem;">Full Name</label>
            <input type="text" required placeholder="Alex Mercer" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-subtle); color: var(--text-primary);">
          </div>
          <div>
            <label style="display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.5rem;">Email Address</label>
            <input type="email" required placeholder="alex@domain.com" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-subtle); color: var(--text-primary);">
          </div>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.5rem;">Subject</label>
          <input type="text" required placeholder="Inquiry #NEX-8902" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-subtle); color: var(--text-primary);">
        </div>

        <div style="margin-bottom: 2rem;">
          <label style="display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 0.5rem;">Message</label>
          <textarea rows="5" required placeholder="How can our concierge team assist you today?" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-subtle); color: var(--text-primary);"></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Submit Inquiry &rarr;</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
