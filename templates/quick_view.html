<div id="quickview-modal" class="modal-overlay" onclick="if(event.target === this) closeQuickView();">
  <div class="modal-card" style="position: relative; max-width: 800px; width: 92%; background: var(--bg-card); border-radius: var(--radius-xl); padding: 2.5rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg);">
    <button class="modal-close-btn" onclick="closeQuickView()" aria-label="Close modal">&times;</button>
    <div id="quick-view-content"></div>
  </div>
</div>
